[package]
name = "keystate-core"
version = "0.1.0"
edition = "2024"
description = "Canonical model, extraction ports, completeness verification, and idempotent output for Keystate."
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/keystate/keystate-core"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
