# Create a release PR even when the next version equals the current one.
#
# Without this, release-plz skips the release when there is no version bump to
# make. The very first release is the case in point: there is no prior tag, so
# the next version is the current one (0.1.0) and release-plz reports the
# repository as "already up-to-date" and opens no PR (`prs: []`).
release_always = true